name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  # Instructs GitHub Actions runner to cleanly execute on Node 24 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Verify Environment and Pip Upgrade
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Project Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile and Validate Syntax
        run: |
          python -m compileall infraguardian/

      - name: Run Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  self-scan:
    name: Run InfraGuardian Self-Audit
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Execute Policy Scan on Repository
        run: |
          infraguardian scan . --format terminal